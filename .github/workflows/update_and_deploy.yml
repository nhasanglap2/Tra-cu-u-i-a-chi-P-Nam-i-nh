name: Update Data and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and committing changes
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow the auto-commit to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Compress Sheet Data
        run: python update_data.py

      - name: Commit and Push if data.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Check if there are changes to commit
          if ! git diff --quiet && git diff --staged --quiet; then
            git commit -m "Auto-update data.json from Google Sheets [skip ci]"
            git push
          else
            echo "No changes in data.json"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload root folder containing index.html, style.css, app.js and the newly generated data.json
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
